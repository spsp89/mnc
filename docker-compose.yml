services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: bnc
      POSTGRES_USER: bnc
      POSTGRES_PASSWORD: bnc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - bnc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnc -d bnc"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bnc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bnc_local
      MINIO_ROOT_PASSWORD: bnc_local_storage_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bnc_minio_data:/data

volumes:
  bnc_postgres_data:
  bnc_redis_data:
  bnc_minio_data:

